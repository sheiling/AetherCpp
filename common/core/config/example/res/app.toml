# ============================================================
# app.toml — Aether Platform 示例配置文件
#
# 覆盖场景：
#   [app]       应用基础信息
#   [ui]        界面主题配置
#   [server]    HTTP 服务配置（含嵌套 [server.tls]）
#   [database]  数据库连接池配置
#   [logging]   日志系统配置
#   [[servers]] 节点列表（TOML array of tables）
#   [features]  功能开关标志集合
# ============================================================

# ── 应用基础信息 ───────────────────────────────────────────────────────────────
[app]
name        = "Aether Platform"
version     = "2.0.0"
debug       = false
description = "Aether Platform"
build_date  = "2026-03-12"
max_threads = 8
pi_value    = 3.141592653589793     # 浮点示例

# 字符串数组（标签）
tags = ["production", "embedded", "ess", "toml11"]

# 整数数组（允许端口列表）
allowed_ports = [8080, 8443, 9090, 9443]

# ── UI / 主题配置 ────────────────────────────────────────────────────────────
[ui]
# 颜色主题名称（不含 .xml 扩展名），对应 styles/qt_material/themes/ 下的文件
# 亮色系：light_blue  light_cyan  light_cyan_500  light_teal  light_amber
#         light_red   light_pink  light_purple   light_lightgreen  light_yellow
# 暗色系：dark_blue   dark_cyan   dark_teal      dark_amber   dark_red
#         dark_pink   dark_purple dark_lightgreen dark_yellow
theme = "light_cyan_500"

# ── HTTP 服务配置 ──────────────────────────────────────────────────────────────
[server]
host    = "0.0.0.0"
port    = 8080
timeout = 30          # 请求超时（秒）
workers = 4

# 嵌套表：TLS 配置
[server.tls]
enabled  = false
cert     = "/etc/ssl/certs/server.crt"
key      = "/etc/ssl/private/server.key"
min_ver  = "TLSv1.2"

# 跨域配置
[server.cors]
enabled  = true
origins  = ["https://app.example.com", "https://admin.example.com"]
methods  = ["GET", "POST", "PUT", "DELETE"]
max_age  = 3600

# ── 数据库连接池配置 ───────────────────────────────────────────────────────────
[database]
driver       = "postgresql"
host         = "localhost"
port         = 5432
name         = "ess_db"
user         = "ess_user"
password     = "s3cr3t"
pool_size    = 10
max_lifetime = 3600     # 连接最大生命周期（秒）
idle_timeout = 600      # 空闲超时（秒）
ssl_mode     = "prefer"
log_queries  = false

# ── 日志配置 ──────────────────────────────────────────────────────────────────
[logging]
level       = "info"        # trace / debug / info / warn / error / critical
dir         = "logs"
max_size_mb = 10
max_files   = 30
console     = true
color       = true
pattern     = "[%Y-%m-%d %H:%M:%S.%e] [%^%-8l%$] [%n] %v"

# ── 功能开关 ──────────────────────────────────────────────────────────────────
[features]
enable_metrics      = true
enable_tracing      = false
enable_hot_reload   = true
enable_cache        = true
enable_compression  = false
cache_ttl_seconds   = 300

# ── 集群配置（Array of Tables）────────────────────────────────────────────────
# 演示 TOML 的 [[array of tables]] 特性
# 注意：先定义 [cluster] 全局属性，再追加 [[cluster.nodes]] 数组
[cluster]
name               = "ess-cluster-prod"
replication_factor = 2
auto_failover      = true
heartbeat_ms       = 1000

[[cluster.nodes]]
id      = 1
name    = "primary"
host    = "10.0.1.1"
port    = 5000
role    = "master"
weight  = 100

[[cluster.nodes]]
id      = 2
name    = "replica-1"
host    = "10.0.1.2"
port    = 5000
role    = "replica"
weight  = 50

[[cluster.nodes]]
id      = 3
name    = "replica-2"
host    = "10.0.1.3"
port    = 5000
role    = "replica"
weight  = 50
