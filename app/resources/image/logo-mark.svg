<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Aether brand icon mark -->
  <!-- Geometric delta/peak/chevron symbol representing upper atmosphere and elevation -->
  <!-- The stylized "A" integrates the letterform into an abstract mountain peak -->
  <g stroke="#00BCD4" fill="none">
    <!-- Angled legs forming a sharp peak with integrated "A" silhouette -->
    <path d="M 10 56 L 32 10 L 54 56" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Horizontal crossbar completing the letterform -->
    <line x1="20" y1="36" x2="44" y2="36" stroke-width="8" stroke-linecap="butt"/>
  </g>
</svg>
