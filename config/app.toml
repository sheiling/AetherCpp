# ============================================================
# app.toml — Aether Platform 示例配置文件
#
# 覆盖场景：
#   [app]       应用基础信息
#   [ui]        界面主题配置
#   [server]    HTTP 服务配置（含嵌套 [server.tls]）
#   [database]  数据库连接池配置
#   [logging]   日志系统配置
#   [[servers]] 节点列表（TOML array of tables）
#   [features]  功能开关标志集合
#   [help]      帮助页版本信息与 PDF 文档路径
# ============================================================

# ── 应用基础信息 ───────────────────────────────────────────────────────────────
[app]
name        = "Aether Platform"
version     = "2.0.0"
debug       = false
description = "Aether Platform"
build_date  = "2026-03-12"
max_threads = 8
pi_value    = 3.141592653589793     # 浮点示例

# 字符串数组（标签）
tags = ["production", "embedded", "ess", "toml11"]

# 整数数组（允许端口列表）
allowed_ports = [8080, 8443, 9090, 9443]

# ── UI / 主题配置 ────────────────────────────────────────────────────────────
[ui]
# 启动时应用的 ACSS 主题（不含 .xml）；未配置时默认使用 dark_theme
theme = "dark_aether"
# 标题栏「切换亮/暗」使用的两套主题名（toggleTheme / setTheme）
light_theme = "light_blue"
dark_theme  = "dark_aether"
# 可选：ACSS 样式包目录名（styles/ 下子目录，默认 qt_material）
# style = "qt_material"
# 颜色主题候选（styles/qt_material/themes/ 下 xml 文件名，不含扩展名）：
# 亮色系：light_blue  light_cyan  light_cyan_500  light_teal  light_amber
#         light_red   light_pink  light_purple   light_lightgreen  light_yellow
# 暗色系：dark_blue   dark_cyan   dark_teal      dark_amber   dark_red
#         dark_pink   dark_purple dark_lightgreen dark_yellow  dark_aether

# ── 帮助页（Help 插件读取；版本空串时回退 [app] 同名字段）────────────────────
[help.version]
app_name        = "Aether 检测系统"
current_version = ""              # 空则使用 [app].version
build_time      = ""              # 空则使用 [app].build_date
update_time     = "2026-04-22 16:00"

[help.documents]
user_manual = "help/用户手册.pdf"
maintenance = "help/维护手册.pdf"
help_doc    = "help/帮助文档.pdf"

# ── HTTP 服务配置 ──────────────────────────────────────────────────────────────
[server]
host    = "0.0.0.0"
port    = 8080
timeout = 30          # 请求超时（秒）
workers = 4

# 嵌套表：TLS 配置
[server.tls]
enabled  = false
cert     = "/etc/ssl/certs/server.crt"
key      = "/etc/ssl/private/server.key"
min_ver  = "TLSv1.2"

# 跨域配置
[server.cors]
enabled  = true
origins  = ["https://app.example.com", "https://admin.example.com"]
methods  = ["GET", "POST", "PUT", "DELETE"]
max_age  = 3600

# ── 数据库连接池配置 ───────────────────────────────────────────────────────────
[database]
driver       = "postgresql"
host         = "localhost"
port         = 5432
name         = "ess_db"
user         = "ess_user"
password     = "s3cr3t"
pool_size    = 10
max_lifetime = 3600     # 连接最大生命周期（秒）
idle_timeout = 600      # 空闲超时（秒）
ssl_mode     = "prefer"
log_queries  = false

# ── 日志配置 ──────────────────────────────────────────────────────────────────
[logging]
level       = "info"        # trace / debug / info / warn / error / critical
dir         = "logs"
max_size_mb = 10
max_files   = 30
console     = true
color       = true
pattern     = "[%Y-%m-%d %H:%M:%S.%e] [%^%-8l%$] [%n] %v"

# ── Bootstrap CoreModules 实际读取配置（app/bootstrap/core_modules.cpp）───────
# 注意：当前启动模块读取的是 [logger]、[orm]、[deviceManager]、[scheduler]、[splash] 等，不是上面的 [logging]/[database]。

[deviceManager]
enabled          = true
deviceConfigPath = "config/device_config.json"

[logger]
appName        = "Aether Platform"
logDir         = "logs"
pattern        = "[%Y-%m-%d %H:%M:%S.%e] [%^%-8l%$] [%n] %v"
level          = 2          # logger::LogLevel，常用：0 Trace, 1 Debug, 2 Info
target         = 2          # logger::OutputTarget，常用：2 Both
enableColor    = true
rotateStrategy = 3          # logger::RotateStrategy，常用：3 Both
maxFileSize    = 10485760   # 10 MiB
maxRotatedFiles = 30
rotationHour   = 0
rotationMinute = 0
maxDailyFiles  = 30
flushMode      = 0          # 0=Buffered(异步缓冲,Error+刷盘) 1=Sync(Info+同步刷盘)

[scheduler]
enabled = true
flowsDir = "config/flows"
flowsName = "machine_normally"
resetFlowName = "machine_reset"
estopFlowName = "machine_estop"
maxConcurrent = 1
continuousIntervalMs = 0
continuousResubmitOnFail = false

[scheduler.buttonMonitor]
enabled = true
pollIntervalMs = 20
startBtn = "启动按钮"
stopBtn = "停止按钮"
resetBtn = "复位按钮"
modeSwitch = "手动"
estop = "急停按钮"

[splash]
enabled = true
# 空则依次尝试 config/splash.* 与内置 app_splash.ico；相对路径相对于 exe 目录
imagePath = ""

[orm]
driverName     = "QSQLITE"  # 可选：QSQLITE/QMYSQL/QPSQL/QODBC
database       = "data/aether.db"
host           = "127.0.0.1"
port           = 0
username       = ""
password       = ""
connectOptions = ""
traceSql       = false
traceSqlError  = true

# ── 功能开关 ──────────────────────────────────────────────────────────────────
[features]
enable_metrics      = true
enable_tracing      = false
enable_hot_reload   = true
enable_cache        = true
enable_compression  = false
cache_ttl_seconds   = 300

# ── 虚拟相机 / 虚拟运控调试 ──
[virtual_debug]
virtual_camera_enable = false
virtual_motion_enable = false

[virtual_debug.camera]
image_path = ""
frame_rate = 10

# ── 集群配置（Array of Tables）────────────────────────────────────────────────
# 演示 TOML 的 [[array of tables]] 特性
# 注意：先定义 [cluster] 全局属性，再追加 [[cluster.nodes]] 数组
[cluster]
name               = "ess-cluster-prod"
replication_factor = 2
auto_failover      = true
heartbeat_ms       = 1000

[[cluster.nodes]]
id      = 1
name    = "primary"
host    = "10.0.1.1"
port    = 5000
role    = "master"
weight  = 100

[[cluster.nodes]]
id      = 2
name    = "replica-1"
host    = "10.0.1.2"
port    = 5000
role    = "replica"
weight  = 50

[[cluster.nodes]]
id      = 3
name    = "replica-2"
host    = "10.0.1.3"
port    = 5000
role    = "replica"
weight  = 50
